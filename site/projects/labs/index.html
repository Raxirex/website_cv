<div id="app">
  <header class="top">
    <button class="brand" id="btnHome" title="All simulations"><svg class="logo"><use href="#i-logo"/></svg><span class="brand-name">Dynamic Interactive Labs</span></button>
    <div class="modsw">
      <button class="btn ghost" id="btnModules" title="Switch simulation"><span id="modTitle">Simulations</span><svg class="ico sm"><use href="#i-down"/></svg></button>
      <div class="popover modpop" id="modPop" hidden></div>
    </div>
    <div class="modctl" data-for="mechanics" hidden>
      <button class="btn ghost model-btn" id="btnPresets" title="Open a preset system"><span id="modelName">Pulley system</span><svg class="ico sm"><use href="#i-down"/></svg></button>
      <div class="spacer"></div>
      <div class="group hide-sm">
        <button class="icon-btn" id="btnUndo" title="Undo (Ctrl+Z)"><svg class="ico"><use href="#i-undo"/></svg></button>
        <button class="icon-btn" id="btnRedo" title="Redo (Ctrl+Shift+Z)"><svg class="ico"><use href="#i-redo"/></svg></button>
      </div>
      <div class="transport">
        <button class="icon-btn" id="btnReset" title="Reset to t = 0 (R)"><svg class="ico"><use href="#i-reset"/></svg></button>
        <button class="play" id="btnPlay" title="Play / pause (Space)"><svg class="ico"><use href="#i-play"/></svg><span class="play-label">Run</span></button>
        <button class="icon-btn hide-sm" id="btnStep" title="Advance one time step"><svg class="ico"><use href="#i-step"/></svg></button>
        <div class="speed">
          <button class="speed-btn" id="btnSpeed" title="Time multiplier"><span id="speedLabel">1×</span></button>
          <div class="popover" id="speedPop" hidden>
            <div class="pop-head"><span>Time multiplier</span><b id="speedVal">1.00×</b></div>
            <input type="range" id="speedRange" min="-2" max="1.3" step="0.01" value="0" aria-label="Time multiplier">
            <div class="chips" id="speedChips"></div>
            <p class="pop-note">Simulated seconds per real second. Below 1× is slow motion.</p>
          </div>
        </div>
      </div>
    </div>
    <div class="modctl" data-for="home" hidden><div class="spacer"></div></div>
    <div class="modctl" data-for="soon" hidden><div class="spacer"></div></div>
    <button class="icon-btn" id="btnTheme" title="Theme and colours"><svg class="ico"><use href="#i-palette"/></svg></button>
  </header>

  <main class="views">
  <section class="view" id="view-home" hidden></section>
  <section class="view work" id="view-mechanics" hidden>
    <nav class="tools" id="tools" aria-label="Tools"></nav>

    <section class="stage" id="stage">
      <canvas id="cv" aria-label="System drawing"></canvas>
      <div class="hud" id="hud"></div>
      <div class="topts" id="topts" hidden></div>
      <button class="trainfab" id="trainFab" type="button" hidden></button>
      <div class="zoom">
        <button class="icon-btn" id="btnZoomIn" title="Zoom in"><svg class="ico"><use href="#i-plus"/></svg></button>
        <button class="icon-btn" id="btnZoomOut" title="Zoom out"><svg class="ico"><use href="#i-minus"/></svg></button>
        <button class="icon-btn" id="btnFit" title="Fit system to view (F)"><svg class="ico"><use href="#i-fit"/></svg></button>
        <button class="icon-btn" id="btnFollow" title="Camera follows the selected part"><svg class="ico"><use href="#i-follow"/></svg></button>
      </div>
    </section>

    <section class="drawer" id="drawer">
      <div class="plot" id="plot">
        <div class="plot-bar">
          <div class="chips plot-chips" id="plotChips"></div>
          <select id="plotAdd" class="select sm" aria-label="Add a channel"></select>
          <div class="plot-ctl">
            <div class="seg sm" id="plotMode"><button data-v="time" class="on">Time</button><button data-v="phase">Phase</button></div>
            <select id="plotWin" class="select sm" aria-label="Time window"><option value="5">5 s</option><option value="10" selected>10 s</option><option value="30">30 s</option><option value="0">All</option></select>
            <button class="icon-btn sm" id="plotCsv" title="Copy data as CSV"><svg class="ico"><use href="#i-copy"/></svg></button>
            <button class="icon-btn sm hide-sm" id="plotToggle" title="Collapse plot"><svg class="ico"><use href="#i-down"/></svg></button>
          </div>
        </div>
        <div class="plot-body"><canvas id="plotCanvas"></canvas></div>
      </div>
    </section>

    <aside class="panel" id="panel">
      <div class="tabs" role="tablist">
        <button class="tab on" data-tab="inspect" role="tab">Inspect</button>
        <button class="tab" data-tab="system" role="tab">System</button>
        <button class="tab show-sm" data-tab="plot" role="tab">Plot</button>
        <button class="tab" data-tab="analysis" role="tab">Analysis</button>
        <button class="tab-grip show-sm" id="sheetGrip" title="Expand panel" aria-label="Expand panel"><svg class="ico sm"><use href="#i-down"/></svg></button>
      </div>
      <div class="tabbody" id="tab-inspect"></div>
      <div class="tabbody" id="tab-system" hidden></div>
      <div class="tabbody" id="tab-plot" hidden></div>
      <div class="tabbody" id="tab-analysis" hidden></div>
    </aside>
  </section>

  <section class="view" id="view-eng" hidden></section>
  <section class="view" id="view-soon" hidden></section>
  </main>

  <div class="scrim" id="presetScrim" hidden>
    <div class="sheet" role="dialog" aria-label="Presets">
      <div class="sheet-head"><h2>Open a system</h2><button class="icon-btn" id="presetClose" title="Close"><svg class="ico"><use href="#i-close"/></svg></button></div>
      <p class="sheet-note">Loading a preset replaces the current system. Undo brings it back.</p>
      <div class="preset-list" id="presetList"></div>
    </div>
  </div>
  <div class="scrim" id="themeScrim" hidden><div class="sheet theme-sheet" id="themeSheet" role="dialog" aria-label="Theme"></div></div>
  <div class="toast" id="toast" hidden></div>
</div>
